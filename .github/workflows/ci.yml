name: CI

on:
  pull_request:
    paths: ["backend/**", "frontend/**", "docker-compose.yml", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", "docker-compose.yml", ".github/workflows/ci.yml"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: jobhunter, POSTGRES_PASSWORD: jobhunter, POSTGRES_DB: jobhunter }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobhunter" --health-interval 5s --health-retries 10
    env:
      JH_ENVIRONMENT: test
      JH_DATABASE_URL: postgresql+asyncpg://jobhunter:jobhunter@localhost:5432/jobhunter
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy src
      - name: Tests
        run: uv run pytest -q
      - name: Migrations apply on a real Postgres
        run: uv run alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Build
        run: npm run build

  # Fails when a backend change alters the API without regenerating the frontend types.
  api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run python scripts/export_openapi.py > ../frontend/openapi.json
        working-directory: backend
      - run: npm ci --no-audit --no-fund && npm run gen:api
        working-directory: frontend
      - name: Generated types are up to date
        run: git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        target: [api, matching-worker, resume-renderer]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.target }} image
        run: docker build --target ${{ matrix.target }} -t jobhunter-${{ matrix.target }} backend
